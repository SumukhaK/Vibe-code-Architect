<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="The loop: an issue goes to a worker, who writes tests first and opens a PR with proof. CI guardrails check it; failures go back to the worker. A review packet goes to the reviewer; requested changes go back to the worker; an approval goes to the owner, who merges, and the next issue starts.">
  <style>
    .t { font-family: "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; }
    .h { font-size: 26px; font-weight: 700; fill: #1d2a4a; }
    .s { font-size: 15px; fill: #5b6478; }
    .n { font-size: 17px; font-weight: 700; fill: #1d2a4a; }
    .ns { font-size: 13px; fill: #4d5669; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .e { font-size: 13px; font-weight: 600; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a93a6"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e05a47"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a9d6f"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="956" height="466" rx="28" fill="#fbf7ef" stroke="#eadfca" stroke-width="2"/>
  <text class="t h" x="48" y="62">The loop</text>
  <text class="t s" x="48" y="88">Workers stop at the PR. Scripts check what scripts can. The reviewer judges. The owner merges.</text>

  <!-- top row -->
  <g>
    <rect x="48" y="150" width="180" height="78" rx="16" fill="#ffffff" stroke="#d8cdb6" stroke-width="2"/>
    <circle cx="70" cy="150" r="13" fill="#1d2a4a"/><text class="t num" x="70" y="155" text-anchor="middle">1</text>
    <text class="t n" x="138" y="184" text-anchor="middle">Issue</text>
    <text class="t ns" x="138" y="206" text-anchor="middle">acceptance criteria</text>
  </g>
  <g>
    <rect x="276" y="150" width="180" height="78" rx="16" fill="#e7f5ee" stroke="#2a9d6f" stroke-width="2"/>
    <circle cx="298" cy="150" r="13" fill="#2a9d6f"/><text class="t num" x="298" y="155" text-anchor="middle">2</text>
    <text class="t n" x="366" y="184" text-anchor="middle">Worker</text>
    <text class="t ns" x="366" y="206" text-anchor="middle">one branch · test first</text>
  </g>
  <g>
    <rect x="504" y="150" width="180" height="78" rx="16" fill="#e7f5ee" stroke="#2a9d6f" stroke-width="2"/>
    <circle cx="526" cy="150" r="13" fill="#2a9d6f"/><text class="t num" x="526" y="155" text-anchor="middle">3</text>
    <text class="t n" x="594" y="184" text-anchor="middle">Pull request</text>
    <text class="t ns" x="594" y="206" text-anchor="middle">+ proof · then stop</text>
  </g>
  <g>
    <rect x="732" y="150" width="180" height="78" rx="16" fill="#e8f0fe" stroke="#3b74ee" stroke-width="2"/>
    <circle cx="754" cy="150" r="13" fill="#3b74ee"/><text class="t num" x="754" y="155" text-anchor="middle">4</text>
    <text class="t n" x="822" y="184" text-anchor="middle">CI guardrails</text>
    <text class="t ns" x="822" y="206" text-anchor="middle">lint · types · rules</text>
  </g>

  <!-- bottom row -->
  <g>
    <rect x="732" y="320" width="180" height="78" rx="16" fill="#e8f0fe" stroke="#3b74ee" stroke-width="2"/>
    <circle cx="754" cy="320" r="13" fill="#3b74ee"/><text class="t num" x="754" y="325" text-anchor="middle">5</text>
    <text class="t n" x="822" y="354" text-anchor="middle">Review packet</text>
    <text class="t ns" x="822" y="376" text-anchor="middle">issue · diff · proof</text>
  </g>
  <g>
    <rect x="504" y="320" width="180" height="78" rx="16" fill="#f1ecfb" stroke="#7c63d0" stroke-width="2"/>
    <circle cx="526" cy="320" r="13" fill="#7c63d0"/><text class="t num" x="526" y="325" text-anchor="middle">6</text>
    <text class="t n" x="594" y="354" text-anchor="middle">Reviewer</text>
    <text class="t ns" x="594" y="376" text-anchor="middle">judges · VERDICT line</text>
  </g>
  <g>
    <rect x="276" y="320" width="180" height="78" rx="16" fill="#fff4dc" stroke="#f4a71d" stroke-width="2"/>
    <circle cx="298" cy="320" r="13" fill="#f4a71d"/><text class="t num" x="298" y="325" text-anchor="middle">7</text>
    <text class="t n" x="366" y="354" text-anchor="middle">Owner merges</text>
    <text class="t ns" x="366" y="376" text-anchor="middle">one click, a human's</text>
  </g>

  <!-- forward arrows -->
  <path d="M232 189 H268" stroke="#8a93a6" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M460 189 H496" stroke="#8a93a6" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M688 189 H724" stroke="#8a93a6" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M822 232 V312" stroke="#2a9d6f" stroke-width="2.5" marker-end="url(#ag)"/>
  <text class="t e" x="832" y="276" style="fill:#2a9d6f">green</text>
  <path d="M728 359 H692" stroke="#8a93a6" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M500 359 H464" stroke="#2a9d6f" stroke-width="2.5" marker-end="url(#ag)"/>
  <text class="t e" x="482" y="412" text-anchor="middle" style="fill:#2a9d6f">approve</text>
  <path d="M272 359 H170 Q138 359 138 330 V236" stroke="#8a93a6" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text class="t e" x="150" y="300" style="fill:#5b6478">next issue</text>

  <!-- back arrows -->
  <path d="M822 146 C822 104 366 104 366 142" stroke="#e05a47" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#ar)"/>
  <rect x="506" y="100" width="176" height="24" rx="12" fill="#fbf7ef"/>
  <text class="t e" x="594" y="117" text-anchor="middle" style="fill:#e05a47">red CI → fix, max 3 tries</text>
  <path d="M594 316 C594 278 366 286 366 236" stroke="#e05a47" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#ar)"/>
  <rect x="404" y="262" width="132" height="24" rx="12" fill="#fbf7ef"/>
  <text class="t e" x="470" y="279" text-anchor="middle" style="fill:#e05a47">changes requested</text>

  <text class="t s" x="48" y="440" style="font-size:13px">Steps 4→5→6→2 are pure relay — the part a companion like GitKeeper automates. Judgement and the merge stay human.</text>
</svg>
