<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vibe-code-Architect logo: a small round robot in a yellow hard hat sketching code on a blueprint">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2c3d66" stroke-width="2"/>
    </pattern>
    <pattern id="bpgrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#7fa6ff" stroke-width="1.5" opacity="0.55"/>
    </pattern>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a71d"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f3e6cf"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#1d2a4a"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#grid)"/>

  <!-- blueprint sheet -->
  <g transform="rotate(-6 256 400)">
    <rect x="96" y="330" width="320" height="130" rx="14" fill="#3b74ee"/>
    <rect x="96" y="330" width="320" height="130" rx="14" fill="url(#bpgrid)"/>
    <text x="232" y="420" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="58" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
    <path d="M300 404 q22 -16 44 0" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/>
  </g>

  <!-- body -->
  <ellipse cx="256" cy="336" rx="96" ry="18" fill="#141d36" opacity="0.55"/>
  <rect x="150" y="150" width="212" height="190" rx="96" fill="url(#body)"/>

  <!-- face -->
  <ellipse cx="216" cy="242" rx="17" ry="21" fill="#1d2a4a"/>
  <ellipse cx="296" cy="242" rx="17" ry="21" fill="#1d2a4a"/>
  <circle cx="222" cy="234" r="6" fill="#ffffff"/>
  <circle cx="302" cy="234" r="6" fill="#ffffff"/>
  <ellipse cx="190" cy="276" rx="15" ry="9" fill="#ff8f87" opacity="0.75"/>
  <ellipse cx="322" cy="276" rx="15" ry="9" fill="#ff8f87" opacity="0.75"/>
  <path d="M238 278 q18 16 36 0" fill="none" stroke="#1d2a4a" stroke-width="7" stroke-linecap="round"/>

  <!-- hard hat -->
  <path d="M160 178 q0 -86 96 -88 q96 2 96 88 z" fill="url(#hat)"/>
  <rect x="136" y="170" width="240" height="24" rx="12" fill="#f4a71d"/>
  <rect x="240" y="92" width="32" height="80" rx="12" fill="#ffd166"/>
  <path d="M250 104 v58" stroke="#f4a71d" stroke-width="5" stroke-linecap="round"/>

  <!-- arm + pencil -->
  <path d="M352 286 q36 18 44 54" fill="none" stroke="#f3e6cf" stroke-width="26" stroke-linecap="round"/>
  <g transform="rotate(32 400 350)">
    <rect x="388" y="300" width="22" height="70" rx="4" fill="#ff7b54"/>
    <rect x="388" y="300" width="22" height="12" rx="4" fill="#ffb3c1"/>
    <path d="M388 370 h22 l-11 22 z" fill="#ffe3b3"/>
    <path d="M395 384 h8 l-4 8 z" fill="#1d2a4a"/>
  </g>

  <!-- sparkle -->
  <path d="M392 112 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7 z" fill="#ffd166"/>
  <circle cx="124" cy="132" r="7" fill="#7fa6ff"/>
</svg>
